<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>PUNARVA — Collector Portal</title>
<meta name="description" content="Collector portal: scan e-waste, check fair prices, find authorized recyclers and track earnings — offline-tolerant, in your language." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C1652E'/%3E%3Cpath d='M16 7l6 4v10l-6 4-6-4V11z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
<script>
  (function () {
    try {
      var t = localStorage.getItem("kc-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  /* ============ Design tokens — lifted from the PUNARVA design system ============ */
  :root{
    --bg:#F3F6F2; --bg-2:#EAEEE7; --panel:#FFFFFF; --panel-2:#F6F8F4;
    --ink:#141F1B; --ink-dim:#4C5851; --ink-faint:#8B958C;
    --border:rgba(20,31,27,0.12); --border-strong:rgba(20,31,27,0.22);
    --copper:#B85A28; --copper-ink:#8f4720; --verdigris:#2F7D62; --steel:#6A7B88; --ochre:#A97C1E;
    --shadow:0 1px 2px rgba(20,31,27,0.06), 0 12px 32px -16px rgba(20,31,27,0.18);
    --shadow-lg:0 24px 60px -24px rgba(20,31,27,0.35);
    --radius-s:10px; --radius-m:16px; --radius-l:26px;
    --font-display:'Space Grotesk','Inter',sans-serif; --font-body:'Inter','Noto Sans Devanagari',sans-serif;
    --ease:cubic-bezier(.22,.68,0,1);
  }
  html[data-theme="dark"]{
    --bg:#101613; --bg-2:#161D19; --panel:#1A211D; --panel-2:#1F2721;
    --ink:#ECF2EE; --ink-dim:#A9B6AE; --ink-faint:#69766F;
    --border:rgba(236,242,238,0.10); --border-strong:rgba(236,242,238,0.18);
    --copper:#E0824A; --copper-ink:#f2a06e; --verdigris:#57BE97; --steel:#9BAAB5; --ochre:#D8B04A;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -16px rgba(0,0,0,0.5);
    --shadow-lg:0 24px 70px -20px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; transition:background .35s var(--ease), color .35s var(--ease); padding-bottom:calc(84px + env(safe-area-inset-bottom,0px)); padding-top:env(safe-area-inset-top,0px);}
  img,svg{display:block; max-width:100%;}
  a{color:inherit; text-decoration:none;}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
  input,select{font:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--copper); outline-offset:2px; border-radius:4px;}
  .icon{width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}
  .num{font-variant-numeric:tabular-nums;}
  .touch-min{min-height:44px;}

  /* ---------- Header ---------- */
  .site-header{position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--border);}
  .header-inner{max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:1rem; height:62px; padding:0 1rem;}
  .brandmark{display:flex; align-items:center; gap:.6rem; min-width:0;}
  .brandmark .logo-chip{width:34px; height:34px; border-radius:9px; background:var(--ink); color:var(--bg); display:grid; place-items:center; flex-shrink:0;}
  html[data-theme="dark"] .brandmark .logo-chip{background:var(--copper); color:#1a1006;}
  .brandmark .txt{min-width:0;}
  .brandmark .txt .b1{font-family:var(--font-display); font-weight:700; font-size:1rem; letter-spacing:-0.01em; line-height:1.1;}
  .brandmark .txt .b2{font-size:.72rem; font-weight:600; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brandmark-link{display:inline-flex; align-items:center; justify-content:center; border-radius:12px; transition:transform .2s ease, opacity .2s ease;}
  .brandmark-link:hover{transform:translateY(-1px); opacity:.92;}
  .scan-methods{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:.75rem; margin:1rem 0 1.2rem;}
  .scan-method{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; width:100%; min-height:124px; padding:1rem .75rem; border:1px solid var(--border); border-radius:var(--radius-m); background:var(--panel-2); color:var(--ink); font-weight:700; cursor:pointer; transition:border-color .2s, transform .2s, background .2s;}
  .scan-method:hover{border-color:var(--copper); transform:translateY(-1px);}
  .scan-method .icon{width:28px; height:28px; color:var(--copper);}
  .scan-preview{margin-top:1rem; border:1px solid var(--border); border-radius:var(--radius-m); background:var(--panel-2); overflow:hidden;}
  .scan-preview img{display:block; width:100%; max-height:260px; object-fit:cover;}
  .camera-stage{display:none; margin-top:1rem; border:1px solid var(--border); border-radius:var(--radius-m); background:var(--panel-2); overflow:hidden;}
  .camera-stage.active{display:block;}
  .camera-stage video{display:block; width:100%; max-height:220px; background:#0e1411; object-fit:cover;}
  .camera-actions{display:flex; gap:.5rem; padding:.7rem; justify-content:end;}
  .header-actions{display:flex; align-items:center; gap:.5rem; flex-shrink:0;}
  .lang-toggle{display:flex; background:var(--panel-2); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px;}
  .lang-btn{padding:.32rem .55rem; border-radius:999px; font-size:.74rem; font-weight:700; color:var(--ink-faint); transition:background .2s,color .2s;}
  .lang-btn.active{background:var(--panel); color:var(--ink); box-shadow:var(--shadow);}
  .theme-toggle{width:36px; height:36px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--border); color:var(--ink-dim); flex-shrink:0;}
  .theme-toggle:hover{border-color:var(--copper); color:var(--copper);}
  .theme-icon{display:none;} html[data-theme="light"] .theme-icon-sun{display:flex;} html[data-theme="dark"] .theme-icon-moon{display:flex;}

  .conn-banner{max-width:900px; margin:0 auto; padding:0 1rem;}
  .pill{display:inline-flex; align-items:center; gap:.4rem; font-size:.74rem; font-weight:700; padding:.35rem .65rem; border-radius:999px;}
  .pill.warn{background:color-mix(in srgb, var(--ochre) 18%, transparent); color:var(--copper-ink);}
  .pill.ok{background:color-mix(in srgb, var(--verdigris) 15%, transparent); color:var(--verdigris);}
  .pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}

  /* ---------- Layout ---------- */
  main{max-width:900px; margin:0 auto; padding:1rem 1rem 2rem;}
  .grid2{display:grid; gap:1rem; grid-template-columns:1fr;}
  @media (min-width:840px){ .grid2{grid-template-columns:1.2fr .8fr;} }
  .stack{display:flex; flex-direction:column; gap:1rem;}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:var(--shadow);}
  .panel-pad{padding:1.1rem;}
  h1.page-title{font-family:var(--font-display); font-weight:700; letter-spacing:-0.01em; font-size:clamp(1.4rem,2.2vw + 1rem,2rem); margin:.15rem 0;}
  .eyebrow{font-size:.8rem; font-weight:700; color:var(--ink-dim);}
  .muted{color:var(--ink-dim);}
  .faint{color:var(--ink-faint);}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:.5rem; padding:.8rem 1.2rem; border-radius:999px; font-weight:700; font-size:.94rem; font-family:var(--font-display); transition:transform .2s var(--ease), box-shadow .2s var(--ease), background .2s, border-color .2s, color .2s; white-space:nowrap;}
  .btn-primary{background:var(--ink); color:var(--bg);}
  html[data-theme="dark"] .btn-primary{background:var(--copper); color:#1a1006;}
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 14px 28px -12px rgba(20,31,27,.4);}
  .btn-accent{background:var(--copper); color:#fff;}
  .btn-accent:hover{transform:translateY(-2px); box-shadow:0 14px 28px -12px rgba(184,90,40,.45);}
  .btn-outline{background:transparent; border:1.5px solid var(--border-strong); color:var(--ink);}
  .btn-outline:hover{border-color:var(--copper); color:var(--copper);}
  .btn-block{width:100%;}
  .btn-lg{padding:1rem 1.5rem; font-size:1.02rem;}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none !important;}

  /* ---------- Primary CTA (Scan & Sell) ---------- */
  .cta-scan{display:flex; align-items:center; gap:1rem; padding:1.2rem 1.35rem; border-radius:var(--radius-l); background:var(--ink); color:#fff; box-shadow:var(--shadow-lg); transition:transform .25s var(--ease), background .25s;}
  html[data-theme="dark"] .cta-scan{background:linear-gradient(135deg, var(--copper), #8f4720);}
  .cta-scan:hover{transform:translateY(-2px);}
  .cta-scan .ic{width:58px; height:58px; border-radius:16px; background:var(--copper); display:grid; place-items:center; flex-shrink:0;}
  .cta-scan .ic .icon{width:28px; height:28px;}
  .cta-scan .big{font-family:var(--font-display); font-weight:700; font-size:clamp(1.3rem,2vw + 1rem,1.7rem); line-height:1.1;}
  .cta-scan .sub{opacity:.75; font-size:.85rem; margin-top:.2rem;}

  /* ---------- Quick nav ---------- */
  .quicknav{display:grid; grid-template-columns:repeat(2,1fr); gap:.75rem;}
  @media (min-width:560px){ .quicknav{grid-template-columns:repeat(4,1fr);} }
  .qn-card{border:1px solid var(--border); background:var(--panel); border-radius:var(--radius-m); padding:.95rem; box-shadow:var(--shadow); transition:transform .2s var(--ease), border-color .2s;}
  .qn-card:hover{transform:translateY(-2px); border-color:var(--border-strong);}
  .qn-card .icon{width:26px; height:26px; color:var(--copper);}
  .qn-card p.lbl{font-weight:700; margin:.55rem 0 .1rem; line-height:1.2;}
  .qn-card p.sub{font-size:.76rem; color:var(--ink-dim); margin:0;}

  /* ---------- Money card ---------- */
  .money-card{border-radius:var(--radius-l); padding:1.2rem; background:var(--copper); color:#fff; box-shadow:var(--shadow);}
  .money-card .lbl{font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; opacity:.85;}
  .money-card .amt{font-family:var(--font-display); font-weight:700; font-size:clamp(2rem,3vw + 1rem,2.6rem); margin-top:.15rem;}
  .money-card .note{font-size:.86rem; opacity:.85; margin-top:.2rem;}
  .money-card .cta{display:block; margin-top:.9rem; text-align:center; background:rgba(255,255,255,.18); border-radius:var(--radius-m); padding:.75rem; font-weight:700;}
  .speak-btn{width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.2); display:grid; place-items:center; flex-shrink:0;}
  .speak-btn:hover{background:rgba(255,255,255,.32);}

  /* ---------- Stepper ---------- */
  .stepper{display:flex; align-items:center; gap:0;}
  .stepper .seg{flex:1; height:5px; background:var(--border); border-radius:3px; margin:0 3px; position:relative; overflow:hidden;}
  .stepper .seg i{position:absolute; inset:0; background:var(--copper); border-radius:3px; transform:scaleX(0); transform-origin:left; transition:transform .35s var(--ease);}
  .stepper .seg.done i, .stepper .seg.active i{transform:scaleX(1);}
  .stepper-labels{display:flex; justify-content:space-between; margin-top:.4rem; font-size:.68rem; font-weight:700; color:var(--ink-faint);}
  .stepper-labels span.active{color:var(--copper);}

  /* ---------- Tables / lists ---------- */
  table.kc-table{width:100%; border-collapse:collapse; font-size:.9rem;}
  table.kc-table th{font-size:.7rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); text-align:left; padding-bottom:.5rem;}
  table.kc-table td{padding:.6rem 0; border-top:1px solid var(--border);}
  .row-link{font-weight:700; color:var(--copper-ink); text-decoration:underline;}
  .list-item{display:flex; align-items:center; justify-content:between; gap:.6rem; padding:.7rem .8rem; border-radius:var(--radius-m); background:var(--panel-2);}
  .list-item + .list-item{margin-top:.5rem;}

  .badge{display:inline-flex; align-items:center; gap:.35rem; font-size:.7rem; font-weight:700; padding:.28rem .55rem; border-radius:999px;}
  .badge.sync-synced{background:color-mix(in srgb, var(--verdigris) 16%, transparent); color:var(--verdigris);}
  .badge.sync-pending{background:color-mix(in srgb, var(--ochre) 18%, transparent); color:var(--copper-ink);}
  .badge.sync-failed{background:color-mix(in srgb, #b3261e 15%, transparent); color:#b3261e;}
  .badge.auth{background:color-mix(in srgb, var(--verdigris) 16%, transparent); color:var(--verdigris);}
  .badge.notauth{background:var(--panel-2); border:1px solid var(--border); color:var(--ink-dim);}

  /* ---------- Empty / loading states ---------- */
  .empty{border-radius:var(--radius-m); background:var(--panel-2); padding:1.6rem 1rem; text-align:center;}
  .empty p.t{font-weight:700; margin:0 0 .3rem;}
  .empty p.b{margin:0; font-size:.88rem; color:var(--ink-dim);}

  /* ---------- Back / top bar for subpages ---------- */
  .subhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:.85rem;}
  .backlink{display:inline-flex; align-items:center; gap:.4rem; background:var(--panel-2); border-radius:999px; padding:.5rem .85rem; font-size:.86rem; font-weight:700;}

  /* ---------- Journey timeline ---------- */
  ol.trace{list-style:none; margin:0; padding:0;}
  ol.trace li{display:flex; gap:.75rem;}
  .trace-dot{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-size:.72rem; font-weight:700; flex-shrink:0;}
  .trace-dot.done{background:var(--verdigris); color:#fff;}
  .trace-dot.pending{background:var(--panel-2); border:1px solid var(--border); color:var(--ink-faint);}
  .trace-line{width:2px; flex:1; background:var(--border); min-height:14px;}
  .trace-line.done{background:var(--verdigris);}
  ol.trace li p{margin:0 0 1rem; font-weight:700;}

  /* ---------- Price board rows ---------- */
  .price-row{display:flex; align-items:center; gap:.8rem; padding:.75rem; border-radius:var(--radius-m); background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow);}
  .mat-icon{width:46px; height:46px; border-radius:12px; background:var(--panel-2); display:grid; place-items:center; flex-shrink:0; color:var(--copper);}
  .price-row .amt{font-family:var(--font-display); font-weight:700; font-size:1.1rem; white-space:nowrap;}

  /* ---------- Map placeholder ---------- */
  .map-frame{position:relative; border-radius:var(--radius-l); background:var(--panel); border:1px solid var(--border); overflow:hidden; height:220px; background-image:radial-gradient(var(--border) 1px, transparent 1px); background-size:20px 20px;}
  .map-frame .pin{position:absolute; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center;}
  .map-frame .pin .head{width:26px; height:26px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:grid; place-items:center; box-shadow:var(--shadow);}
  .map-frame .pin .head svg{transform:rotate(45deg); width:13px; height:13px;}
  .map-frame .pin.auth .head{background:var(--verdigris); color:#fff;}
  .map-frame .pin.notauth .head{background:var(--ink-faint); color:#fff;}

  /* ---------- Filter chips ---------- */
  .chips{display:flex; gap:.5rem; flex-wrap:wrap;}
  .chip{padding:.5rem .95rem; border-radius:999px; font-size:.84rem; font-weight:700; background:var(--panel-2);}
  .chip[aria-pressed="true"]{background:var(--ink); color:var(--bg);}
  html[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--copper); color:#1a1006;}

  /* ---------- Tab bar ---------- */
  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:50; background:color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--border); padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom,0px));}
  .tabbar-inner{max-width:900px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); align-items:end; gap:2px;}
  .tab-btn{display:flex; flex-direction:column; align-items:center; gap:.2rem; padding:.4rem 0; border-radius:12px; color:var(--ink-faint); font-size:.66rem; font-weight:700;}
  .tab-btn .icon{width:20px; height:20px;}
  .tab-btn.active{color:var(--copper);}
  .tab-btn.scan-tab{margin-top:-22px;}
  .tab-btn.scan-tab .icon-wrap{width:48px; height:48px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; box-shadow:var(--shadow-lg); margin-bottom:.15rem;}
  html[data-theme="dark"] .tab-btn.scan-tab .icon-wrap{background:var(--copper); color:#1a1006;}
  .tab-btn.scan-tab .icon{width:22px; height:22px;}

  /* ---------- Scan flow ---------- */
  .field{margin-bottom:1rem;}
  .field label{display:block; font-size:.8rem; font-weight:700; color:var(--ink-dim); margin-bottom:.35rem;}
  .field input, .field select{width:100%; padding:.8rem .9rem; border-radius:var(--radius-s); border:1.5px solid var(--border-strong); background:var(--panel); font-size:1rem;}
  .field input:focus, .field select:focus{border-color:var(--copper);}
  .mat-pick{display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem;}
  @media (min-width:560px){ .mat-pick{grid-template-columns:repeat(4,1fr); } }
  .mat-pick button{display:flex; flex-direction:column; align-items:center; gap:.4rem; padding:.9rem .5rem; border-radius:var(--radius-m); border:1.5px solid var(--border); background:var(--panel);}
  .mat-pick button[aria-pressed="true"]{border-color:var(--copper); background:color-mix(in srgb, var(--copper) 8%, var(--panel));}
  .mat-pick .icon{width:26px; height:26px; color:var(--copper);}
  .rec-pick{display:flex; flex-direction:column; gap:.55rem;}
  .rec-pick button{display:flex; align-items:center; justify-content:space-between; gap:.6rem; padding:.85rem; border-radius:var(--radius-m); border:1.5px solid var(--border); background:var(--panel); text-align:left;}
  .rec-pick button[aria-pressed="true"]{border-color:var(--copper); background:color-mix(in srgb, var(--copper) 8%, var(--panel));}
  .qr-fake{width:140px; height:140px; margin:0 auto; background:#fff; border-radius:8px; padding:8px; display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(7,1fr); gap:2px;}
  .qr-fake i{background:#141F1B; border-radius:1px;}
  .qr-fake i.off{background:transparent;}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="brandmark brandmark-link" aria-label="PUNARVA home">
      <img class="brand-logo" src="../assets/punarva-logo.png" alt="PUNARVA" style="height:34px;width:auto;display:block;" />
    </a>
    <div class="header-actions">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="hi">हिं</button>
        <button class="lang-btn" data-lang="mr">मरा</button>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon theme-icon theme-icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon theme-icon theme-icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>
  <div class="conn-banner" id="connBanner" style="display:none; padding-bottom:.6rem;"></div>
</header>

<main id="view"></main>

<nav class="tabbar" aria-label="Collector navigation">
  <div class="tabbar-inner" id="tabbarInner"></div>
</nav>

<script>
(function(){
"use strict";

/* =========================================================================
   i18n — a compact trilingual dictionary for the app chrome (nav, headers,
   status words). Longer body copy stays in English across languages, same
   as the reference site keeps most marketing copy per-locale but core nav
   consistent in structure.
   ========================================================================= */
var DICT = {
  en:{ collectorIdentity:"Collector Portal", home:"Home", lots:"Lots", map:"Recyclers", earnings:"Earnings", scan:"Scan",
    greetLine:"Welcome back", dashboardTitle:"Collector Dashboard", scanSell:"Scan & Sell", scanSellSub:"Photo → fair price → sold",
    checkPrice:"Check Price", findRecycler:"Find Recycler", myLots:"My Lots", myEarnings:"My Earnings", recentLots:"Recent Lots",
    viewAll:"View all", loadingLots:"Loading your lots…", noLotsTitle:"No lots yet", noLotsBody:"Start your first scan to create a lot.",
    startWithPhoto:"Start with a photo", todayEarn:"Today's Earnings", journey:"Lot Journey", openLedger:"Open Ledger",
    continueCapture:"Continue", offlineBody:"You're offline — everything you do is saved and will sync automatically.",

function localDayKey(d){ d = d||new Date(); return d.toISOString().slice(0,10); }
function monthKeyOf(iso){ return (iso||"").slice(0,7); }
function formatDate(iso, l){ try{ return new Date(iso).toLocaleDateString(l==="en"?"en-IN":l, {day:"numeric", month:"short", year:"numeric"}); }catch(e){ return iso; } }
function formatDay(iso, l){ try{ return new Date(iso).toLocaleDateString(l==="en"?"en-IN":l, {day:"numeric", month:"short"}); }catch(e){ return iso; } }

function summarizeLedger(txns, now){
  now = now || new Date();
  var today = localDayKey(now), month = monthKeyOf(localDayKey(now));
  var out = { today:0, todayCount:0, monthCompleted:0, monthCount:0, pending:0, monthLabel: now.toLocaleDateString(lang==="en"?"en-IN":lang,{month:"long", year:"numeric"}) };
  txns.forEach(function(t){
    if(t.state==="completed" && t.date===today){ out.today += t.amount; out.todayCount++; }
    if(t.state==="completed" && monthKeyOf(t.date)===month){ out.monthCompleted += t.amount; out.monthCount++; }
    if(t.state==="pending"){ out.pending += t.amount; }
  });
  return out;
}
function statusKey(status){
  return { "Collected":"traceCollected", "Listed":"traceListed", "Buyer matched":"traceMatched", "Pickup scheduled":"traceScheduled", "Handover complete":"traceHandover" }[status] || "traceCollected";
}

function countUp(el, to){
  var from = 0, dur = 700, start = null;
  function step(ts){ if(!start) start=ts; var p = Math.min(1, (ts-start)/dur); el.textContent = "₹" + Math.round(from + (to-from)*p).toLocaleString("en-IN"); if(p<1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}

var TABS = [
  { key:"home", route:"#/", icon:"home" },
  { key:"lots", route:"#/lots", icon:"package" },
  { key:"scan", route:"#/scan", icon:"camera", isScan:true },

function renderTabbar(){
  var current = location.hash || "#/";
  var base = current.split("?")[0];
  var activeKey = "home";
  if(base.indexOf("#/lots")===0) activeKey="lots";
  else if(base.indexOf("#/scan")===0) activeKey="scan";
  else if(base.indexOf("#/map")===0) activeKey="map";
  else if(base.indexOf("#/earnings")===0 || base.indexOf("#/value")===0) activeKey = base.indexOf("#/value")===0 ? "" : "earnings";
  var html = TABS.map(function(t){
    if(t.isScan){
      return '<a class="tab-btn scan-tab'+(activeKey===t.key?" active":"")+'" href="'+t.route+'"><span class="icon-wrap">'+icon(t.icon)+'</span>'+tt(t.key)+'</a>';
    }
    return '<a class="tab-btn'+(activeKey===t.key?" active":"")+'" href="'+t.route+'">'+icon(t.icon)+'<span>'+tt(t.key)+'</span></a>';
  }).join("");
  document.getElementById("tabbarInner").innerHTML = html;
}

function renderConnBanner(){
  var el = document.getElementById("connBanner");
  if(!navigator.onLine){
    el.style.display = "block";
    el.innerHTML = '<span class="pill warn"><span class="dot"></span>'+tt("offlineBody")+'</span>';
  } else {
    el.style.display = "none";
  }
}

  else if(hash === "#/earnings") view.appendChild(ViewEarnings());
  else if(hash === "#/value") view.appendChild(ViewValue());

function fakeQr(seed){
  // Deterministic pseudo-QR pattern from the lot id — purely decorative.
  var s = 0; for(var i=0;i<seed.length;i++) s = (s*31 + seed.charCodeAt(i)) % 997;
  var cells = "";
  for(var r=0;r<7;r++) for(var c=0;c<7;c++){
    s = (s*1103515245 + 12345) % 2147483648;
    var on = (s % 100) < 46 || (r<2&&c<2) || (r<2&&c>4) || (r>4&&c<2);
    cells += '<i class="'+(on?"":"off")+'"></i>';
  }
  return cells;
}

/* ---------- Scan & Sell flow (Photo → Weight → Price → Recycler → Schedule → Handover) ---------- */
function ViewScan(){
  var capture = loadCapture() || { phase:0, material:null, weightKg:null, quote:null, recyclerId:null, lotId:"LOT-"+(2000+Math.floor(Math.random()*900)), photoData:null };
  capture.photoData = capture.photoData || null;
  saveCapture(capture);
  var wrap = h('<div></div>');
  var cameraStream = null;

  function readImageFile(file){
    if(!file || !file.type || !file.type.match(/^image\//)) return;
    var reader = new FileReader();
    reader.onload = function(){
      capture.photoData = reader.result;
      capture.photoSource = 'upload';
      persist();
    };
    reader.readAsDataURL(file);
  }

  function captureFromCamera(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      window.alert('Camera access is not supported in this browser. Please upload a photo instead.');
      return;
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(stream){
      cameraStream = stream;
      var stage = wrap.querySelector('#cameraStage');
      var video = wrap.querySelector('#scanCameraPreview');
      if(stage && video){
        video.srcObject = stream;
        video.play();
        stage.classList.add('active');
      }
    }).catch(function(){
      window.alert('Camera permission was denied. You can still upload a photo from your device.');
    });
  }

  function takeCameraSnapshot(){
    var video = wrap.querySelector('#scanCameraPreview');
    if(!video || !cameraStream){ return; }
    var canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    capture.photoData = canvas.toDataURL('image/jpeg', 0.9);
    capture.photoSource = 'camera';
    if(cameraStream){ cameraStream.getTracks().forEach(function(track){ track.stop(); }); cameraStream = null; }
    persist();
  }

  function persist(){ saveCapture(capture); paint(); }
  function paint(){
    wrap.innerHTML =
      subhead(tt("home"), "#/")+
      '<h1 class="page-title">'+tt("scanSell")+'</h1>'+
      renderStepper(capture.phase)+
      '<div class="panel panel-pad" style="margin-top:1rem">'+stepBody()+'</div>';
    wireStep();
  }

  function stepBody(){
    if(capture.phase === 0){
      var photoPreview = capture.photoData ? '<div class="scan-preview"><img src="'+capture.photoData+'" alt="Captured scrap photo" /></div>' : '';
      return '<p class="eyebrow" style="margin-bottom:.6rem">Scan & Check</p>'+
        '<div class="scan-methods">'+
          '<button type="button" class="scan-method" data-scan-method="camera">'+icon("camera")+'<span>Use camera</span></button>'+
          '<button type="button" class="scan-method" data-scan-method="upload">'+icon("package")+'<span>Upload photo</span></button>'+
        '</div>'+
        '<input id="scanUploadInput" type="file" accept="image/*" capture="environment" style="display:none" />'+
        '<div class="camera-stage" id="cameraStage">'+
          '<video id="scanCameraPreview" autoplay playsinline muted></video>'+
          '<div class="camera-actions">'+
            '<button type="button" class="btn btn-outline" data-camera-close>Cancel</button>'+
            '<button type="button" class="btn btn-accent" data-camera-capture>Capture</button>'+
          '</div>'+
        '</div>'+photoPreview+
        '<p class="eyebrow" style="margin:1rem 0 .6rem">'+tt("pickMaterial")+'</p>'+
        '<div class="mat-pick">'+MATERIALS.map(function(m){
          return '<button data-mat="'+m.id+'" aria-pressed="'+(capture.material===m.id)+'">'+icon(m.icon)+'<span style="font-size:.82rem; font-weight:700; text-align:center">'+m.id+'</span></button>';
        }).join("")+'</div>'+
        '<button class="btn btn-accent btn-block btn-lg" style="margin-top:1rem" data-next data-disabled="'+(!capture.material)+'">'+tt("next")+'</button>';
    }
    if(capture.phase === 1){
      return '<p class="eyebrow" style="margin-bottom:.4rem">'+capture.material+'</p>'+
        '<div class="field"><label>'+tt("weightLabel")+'</label><input type="number" min="0.1" step="0.1" id="wInput" value="'+(capture.weightKg||"")+'" placeholder="e.g. 2.5" /></div>'+
        '<div class="grid2" style="grid-template-columns:1fr 1fr">'+
          '<button class="btn btn-outline btn-block" data-back>'+tt("back")+'</button>'+
          '<button class="btn btn-accent btn-block" data-next>'+tt("submitForQuote")+'</button>'+
        '</div>';
    }
    if(capture.phase === 2){
      var m = materialById(capture.material);
      var rate = m.priceMin + Math.round((m.priceMax-m.priceMin) * 0.6);
      capture.quote = capture.quote || rate;
      var total = Math.round(capture.quote * (capture.weightKg||1));
      return '<p class="eyebrow">'+tt("quoteLabel")+'</p>'+
        '<p class="amt num" style="font-family:var(--font-display); font-size:2rem; font-weight:700; margin:.2rem 0">₹'+capture.quote+tt("perKg")+'</p>'+
        '<p class="muted">'+capture.weightKg+' kg × ₹'+capture.quote+' ≈ <strong>'+inr(total)+'</strong></p>'+
        '<div class="grid2" style="grid-template-columns:1fr 1fr; margin-top:.8rem">'+
          '<button class="btn btn-outline btn-block" data-back>'+tt("back")+'</button>'+
          '<button class="btn btn-accent btn-block" data-next>'+tt("acceptQuote")+'</button>'+
        '</div>';
    }
    if(capture.phase === 3){
      var eligible = RECYCLERS.filter(function(r){ return r.materials.indexOf(capture.material)>=0 || r.materials.indexOf({"PCB":"PCB","Copper Cable":"cable","Li-ion Battery":"battery"}[capture.material])>=0; });
      if(!eligible.length) eligible = RECYCLERS;
      return '<p class="eyebrow" style="margin-bottom:.6rem">'+tt("pickRecycler")+'</p>'+
        '<div class="rec-pick">'+eligible.map(function(r){
          return '<button data-rec="'+r.id+'" aria-pressed="'+(capture.recyclerId===r.id)+'"><span><strong>'+r.name+'</strong><br><span class="faint" style="font-size:.78rem">'+r.area+' · '+r.distanceKm+'km</span></span>'+(r.authorized?'<span class="badge auth">'+icon("shield")+tt("authorizedBadge")+'</span>':'')+'</button>';
        }).join("")+'</div>'+
        '<div class="grid2" style="grid-template-columns:1fr 1fr; margin-top:1rem">'+
          '<button class="btn btn-outline btn-block" data-back>'+tt("back")+'</button>'+
          '<button class="btn btn-accent btn-block" data-next data-disabled="'+(!capture.recyclerId)+'">'+tt("next")+'</button>'+
        '</div>';
    }
    if(capture.phase === 4){
      return '<p class="eyebrow" style="margin-bottom:.6rem">'+tt("schedule")+'</p>'+
        '<div class="field"><label>'+tt("schedule")+'</label><input type="date" id="dInput" min="'+localDayKey()+'" value="'+(capture.pickupDate||localDayKey())+'" /></div>'+
        '<div class="grid2" style="grid-template-columns:1fr 1fr">'+
          '<button class="btn btn-outline btn-block" data-back>'+tt("back")+'</button>'+
          '<button class="btn btn-accent btn-block" data-next>'+tt("confirmSchedule")+'</button>'+
        '</div>';
    }
    // phase 5 — handover
    var handoverId = capture.handoverId || ("HX-"+Math.floor(1000+Math.random()*9000));
    capture.handoverId = handoverId;
    return '<div style="text-align:center">'+
      '<p class="eyebrow">'+tt("qrPassport")+'</p>'+
      '<div class="qr-fake">'+fakeQr(capture.lotId)+'</div>'+
      '<p class="muted" style="margin-top:.6rem">'+capture.lotId+' · '+handoverId+'</p>'+
      '</div>'+
      '<div class="field" style="margin-top:1rem"><label>'+tt("pickPayment")+'</label>'+
        '<div class="grid2" style="grid-template-columns:1fr 1fr">'+
          '<button class="btn btn-outline" data-pay="Cash" aria-pressed="'+(capture.method==="Cash")+'">'+tt("cash")+'</button>'+
          '<button class="btn btn-outline" data-pay="UPI" aria-pressed="'+(capture.method==="UPI")+'">'+tt("upi")+'</button>'+
        '</div></div>'+
      '<button class="btn btn-accent btn-block btn-lg" style="margin-top:1rem" data-finish data-disabled="'+(!capture.method)+'">'+tt("markPaid")+'</button>';
  }

  function wireStep(){
    var cameraBtn = wrap.querySelector('[data-scan-method="camera"]');
    if(cameraBtn){ cameraBtn.addEventListener("click", captureFromCamera); }

    var uploadBtn = wrap.querySelector('[data-scan-method="upload"]');
    var uploadInput = wrap.querySelector('#scanUploadInput');
    if(uploadBtn && uploadInput){
      uploadBtn.addEventListener("click", function(){ uploadInput.click(); });
      uploadInput.addEventListener("change", function(event){
        var file = event.target.files && event.target.files[0];
        readImageFile(file);
        uploadInput.value = "";
      });
    }

    var closeCamera = wrap.querySelector('[data-camera-close]');
    if(closeCamera){
      closeCamera.addEventListener("click", function(){
        if(cameraStream){ cameraStream.getTracks().forEach(function(track){ track.stop(); }); cameraStream = null; }
        var stage = wrap.querySelector('#cameraStage');
        if(stage) stage.classList.remove('active');
      });
    }

    var captureCamera = wrap.querySelector('[data-camera-capture]');
    if(captureCamera){ captureCamera.addEventListener("click", takeCameraSnapshot); }

    wrap.querySelectorAll("[data-mat]").forEach(function(b){ b.addEventListener("click", function(){ capture.material=b.getAttribute("data-mat"); persist(); }); });
    wrap.querySelectorAll("[data-rec]").forEach(function(b){ b.addEventListener("click", function(){ capture.recyclerId=b.getAttribute("data-rec"); persist(); }); });
    wrap.querySelectorAll("[data-pay]").forEach(function(b){ b.addEventListener("click", function(){ capture.method=b.getAttribute("data-pay"); persist(); }); });
    var back = wrap.querySelector("[data-back]");
    if(back) back.addEventListener("click", function(){ capture.phase = Math.max(0, capture.phase-1); persist(); });
    var next = wrap.querySelector("[data-next]");
    if(next){
      if(next.getAttribute("data-disabled")==="true") next.disabled = true;
      next.addEventListener("click", function(){
        if(capture.phase===1){ var w = parseFloat((wrap.querySelector("#wInput")||{}).value); if(!w || w<=0) return; capture.weightKg = w; }
        if(capture.phase===4){ capture.pickupDate = (wrap.querySelector("#dInput")||{}).value || localDayKey(); syncLotOnSchedule(); }
        capture.phase = Math.min(PHASES.length-1, capture.phase+1);
        persist();
      });
    }
    var finish = wrap.querySelector("[data-finish]");
    if(finish){
      if(finish.getAttribute("data-disabled")==="true") finish.disabled = true;
      finish.addEventListener("click", finishLot);
    }
  }

  function syncLotOnSchedule(){
    var lots = loadLots();
    var existing = lots.find(function(l){ return l.id===capture.lotId; });
    var lotObj = existing || { id:capture.lotId, createdAt:localDayKey() };
    lotObj.material = capture.material;
    lotObj.weightKg = capture.weightKg;
    lotObj.quote = capture.quote;
    lotObj.recyclerId = capture.recyclerId;
    lotObj.status = "Pickup scheduled";
    lotObj.syncState = navigator.onLine ? "synced" : "pending";
    if(!existing) lots.unshift(lotObj); else lots = lots.map(function(l){ return l.id===lotObj.id ? lotObj : l; });
    saveLots(lots);
  }

  function finishLot(){
    var lots = loadLots();
    var finalPrice = Math.round(capture.quote * capture.weightKg);
    var lotObj = lots.find(function(l){ return l.id===capture.lotId; }) || { id:capture.lotId, createdAt:localDayKey(), material:capture.material, weightKg:capture.weightKg, quote:capture.quote, recyclerId:capture.recyclerId };
    lotObj.status = "Handover complete";
    lotObj.finalPrice = finalPrice;
    lotObj.handoverId = capture.handoverId;
    lotObj.syncState = navigator.onLine ? "synced" : "pending";
    var rest = lots.filter(function(l){ return l.id!==lotObj.id; });
    saveLots([lotObj].concat(rest));

    var txns = loadTxns();
    txns.unshift({ id:"TX-"+Date.now(), lotId:lotObj.id, material:capture.material, weightKg:capture.weightKg, amount:finalPrice, method:capture.method, state: navigator.onLine ? "completed" : "pending", date: localDayKey() });
    saveTxns(txns);

    saveCapture(null);
    location.hash = "#/lots/"+encodeURIComponent(lotObj.id);
  }

  paint();
  return wrap;
}

/* =========================================================================
   Global chrome wiring
   ========================================================================= */
function applyLang(l){
  if(!DICT[l]) return;
  lang = l;
  try{ localStorage.setItem("kc-lang", l); }catch(e){}
  document.querySelectorAll(".lang-btn").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-lang")===l); });
  go();
}
document.querySelectorAll(".lang-btn").forEach(function(b){ b.addEventListener("click", function(){ applyLang(b.getAttribute("data-lang")); }); });
document.querySelectorAll(".lang-btn").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-lang")===lang); });

document.getElementById("themeToggle").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("kc-theme", next); }catch(e){}
});

window.addEventListener("hashchange", go);
window.addEventListener(KC_SYNC_EVENT, function(){ if(location.hash.indexOf("#/scan")!==0) go(); });
window.addEventListener("online", renderConnBanner);
window.addEventListener("offline", renderConnBanner);

go();
})();
</script>
